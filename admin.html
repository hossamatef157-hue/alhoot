<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>لوحة تحكم الحوت</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    main { margin-top: 24px; }
    .bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 16px; }
    .bar h1 { margin: 0; font-size: 1.3rem; }
    .stats { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); margin-bottom: 16px; }
    .stat { padding: 14px; text-align: center; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); }
    .stat b { display: block; font-size: 1.6rem; color: var(--green-2); }
    .stat span { color: var(--muted); font-size: .85rem; }
    .chart { display: flex; align-items: flex-end; gap: 4px; height: 120px; padding: 12px; margin-bottom: 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; }
    .chart div { flex: 1; min-height: 2px; background: var(--green-2); border-radius: 4px 4px 0 0; }
    .tw { overflow-x: auto; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; }
    table { width: 100%; border-collapse: collapse; font-size: .92rem; }
    th, td { padding: 10px 12px; text-align: start; border-bottom: 1px solid var(--border); white-space: nowrap; }
    td .btn { padding: 4px 12px; flex: none; }
    form.f { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); margin-top: 16px; padding: 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; }
    form.f label { display: grid; gap: 4px; font-size: .85rem; color: var(--muted); }
    form.f .wide { grid-column: 1 / -1; }
    input, textarea { width: 100%; padding: 10px 12px; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 10px; }
    input[type=checkbox] { width: auto; }
    .msg { color: #c0392b; min-height: 1.5em; }
    .login { max-width: 360px; margin: 60px auto; display: grid; gap: 10px; }
  </style>
</head>
<body>
<main id="root"></main>
<script src="config.js"></script>
<script>
(function () {
  "use strict";
  var C = window.ALHOOT_CONFIG || {}; C.url = (C.url || "").trim().replace(/\/+$/, "");
  var root = document.getElementById("root"), S = null, apps = [], daily = [];
  try { S = JSON.parse(localStorage.getItem("alhoot_s")); } catch (e) {}

  function el(t, c, x) { var e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; }
  function save(s) { S = s; try { s ? localStorage.setItem("alhoot_s", JSON.stringify(s)) : localStorage.removeItem("alhoot_s"); } catch (e) {} }
  function num(n) { return Number(n || 0).toLocaleString("ar-EG"); }

  function auth(body, grant) {
    return fetch(C.url + "/auth/v1/token?grant_type=" + grant, { method: "POST", headers: { apikey: C.anonKey, "Content-Type": "application/json" }, body: JSON.stringify(body) })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error_description || j.msg || "فشل الدخول"); return j; }); })
      .then(function (j) { save({ t: j.access_token, r: j.refresh_token }); });
  }
  function api(path, o, retry) {
    o = o || {};
    o.headers = Object.assign({ apikey: C.anonKey, Authorization: "Bearer " + (S && S.t), "Content-Type": "application/json" }, o.headers);
    return fetch(C.url + "/rest/v1/" + path, o).then(function (r) {
      if (r.status === 401 && !retry && S && S.r) return auth({ refresh_token: S.r }, "refresh_token").then(function () { return api(path, o, true); });
      if (!r.ok) return r.text().then(function (t) { throw new Error(t); });
      return r.status === 204 ? null : r.text().then(function (t) { return t ? JSON.parse(t) : null; });
    });
  }

  function loginView(err) {
    root.textContent = "";
    var f = el("form", "login"), m = el("p", "msg", err || "");
    f.appendChild(el("h1", null, "دخول لوحة التحكم"));
    var em = el("input"); em.type = "email"; em.placeholder = "الإيميل"; em.required = true; em.autocomplete = "username";
    var pw = el("input"); pw.type = "password"; pw.placeholder = "كلمة السر"; pw.required = true; pw.autocomplete = "current-password";
    var b = el("button", "btn", "دخول"); b.type = "submit";
    f.append(em, pw, b, m);
    f.onsubmit = function (e) {
      e.preventDefault();
      auth({ email: em.value, password: pw.value }, "password").then(load).catch(function (x) { m.textContent = x.message; });
    };
    root.appendChild(f);
  }

  function load() {
    api("admins?select=user_id").then(function (a) {
      if (!a || !a.length) { save(null); return loginView("هذا الحساب ليس أدمن."); }
      return Promise.all([api("apps?select=*&order=sort.asc"), api("rpc/admin_daily", { method: "POST", body: JSON.stringify({ p_days: 30 }) })])
        .then(function (r) { apps = r[0] || []; daily = r[1] || []; dash(); });
    }).catch(function () { save(null); loginView("انتهت الجلسة، سجّل الدخول من جديد."); });
  }

  function dash() {
    root.textContent = "";
    var today = new Date(), days = [], per = {}, d7 = 0, d30 = 0, i;
    daily.forEach(function (r) { per[r.app_id] = (per[r.app_id] || 0) + r.n; d30 += r.n; });
    var byDay = {}; daily.forEach(function (r) { byDay[r.day] = (byDay[r.day] || 0) + r.n; });
    for (i = 13; i >= 0; i--) { var d = new Date(today - i * 864e5).toISOString().slice(0, 10); days.push(byDay[d] || 0); }
    for (i = 0; i < 7; i++) d7 += days[13 - i];
    var total = apps.reduce(function (s, a) { return s + a.downloads; }, 0);

    var bar = el("div", "bar"); bar.appendChild(el("h1", null, "لوحة تحكم الحوت"));
    var acts = el("div", "actions");
    var add = el("button", "btn", "+ تطبيق"); add.onclick = function () { form({}); };
    var out = el("button", "btn secondary", "خروج"); out.onclick = function () { save(null); loginView(); };
    acts.append(add, out); bar.appendChild(acts); root.appendChild(bar);

    var st = el("div", "stats");
    [["إجمالي التحميلات", total], ["آخر 7 أيام", d7], ["آخر 30 يوم", d30], ["التطبيقات", apps.length]].forEach(function (x) {
      var s = el("div", "stat"); s.append(el("b", null, num(x[1])), el("span", null, x[0])); st.appendChild(s);
    });
    root.appendChild(st);

    var ch = el("div", "chart"), mx = Math.max.apply(null, days.concat(1));
    days.forEach(function (n) { var b = el("div"); b.style.height = (n / mx * 100) + "%"; b.title = n; ch.appendChild(b); });
    root.appendChild(ch);

    var tw = el("div", "tw"), t = el("table"), hr = el("tr");
    ["التطبيق", "الإصدار", "التحميلات", "30 يوم", "منشور", ""].forEach(function (h) { hr.appendChild(el("th", null, h)); });
    t.appendChild(hr);
    apps.forEach(function (a) {
      var tr = el("tr");
      [a.icon + " " + a.name, a.version || "—", num(a.downloads), num(per[a.id]), a.published ? "نعم" : "لا"].forEach(function (x) { tr.appendChild(el("td", null, x)); });
      var td = el("td"), e = el("button", "btn secondary", "تعديل"), x = el("button", "btn secondary", "حذف");
      e.onclick = function () { form(a); };
      x.onclick = function () { if (confirm("حذف " + a.name + " وكل إحصائياته؟")) api("apps?id=eq." + encodeURIComponent(a.id), { method: "DELETE" }).then(load).catch(function (z) { alert(z.message); }); };
      td.append(e, " ", x); tr.appendChild(td); t.appendChild(tr);
    });
    tw.appendChild(t); root.appendChild(tw);
    if (!apps.length) root.appendChild(el("p", "msg", "لسه مفيش تطبيقات. اضغط «+ تطبيق» وضيف أول تطبيق."));
    licBox();
  }

  function licBox() {
    var f = el("form", "f"), pl = el("select"), ap = el("input"), n = el("input"), out = el("textarea"), tb = el("div", "tw wide");
    f.appendChild(el("h3", "wide", "🔑 أكواد تفعيل جَرْد برو"));
    [["monthly", "شهري (100 ج.م / 30 يوم)"], ["lifetime", "مرة واحدة (1000 ج.م)"]].forEach(function (x) { var o = el("option", null, x[1]); o.value = x[0]; pl.appendChild(o); });
    ap.value = "com.example.jard"; n.type = "number"; n.value = 1; n.min = 1; n.max = 100; out.rows = 3; out.readOnly = true;
    function lab(t, c, w) { var l = el("label", w ? "wide" : "", t); l.appendChild(c); f.appendChild(l); }
    lab("الباقة", pl); lab("applicationId (فاضي = أي تطبيق)", ap); lab("العدد", n); lab("الأكواد الجديدة (انسخها وابعتها للعميل)", out, true);
    var b = el("button", "btn", "إنشاء أكواد"); b.type = "submit"; f.appendChild(b); f.appendChild(tb);
    function loadLic() {
      api("licenses?select=code,plan,device_id,expires_at&order=created_at.desc&limit=50").then(function (rows) {
        tb.textContent = ""; var t = el("table"), hr = el("tr");
        ["الكود", "الباقة", "الحالة"].forEach(function (x) { hr.appendChild(el("th", null, x)); }); t.appendChild(hr);
        (rows || []).forEach(function (r) {
          var tr = el("tr"), st = !r.device_id ? "غير مستخدم" : (r.expires_at ? "ينتهي " + r.expires_at.slice(0, 10) : "مفعّل دائم");
          [r.code, r.plan === "monthly" ? "شهري" : "مرة واحدة", st].forEach(function (x) { tr.appendChild(el("td", null, x)); }); t.appendChild(tr);
        });
        tb.appendChild(t);
      }).catch(function () {});
    }
    f.onsubmit = function (e) {
      e.preventDefault();
      api("rpc/admin_generate_licenses", { method: "POST", body: JSON.stringify({ p_plan: pl.value, p_count: parseInt(n.value, 10) || 1, p_app: ap.value.trim() }) })
        .then(function (r) { out.value = (r || []).map(function (x) { return x.license_code; }).join("\n"); loadLic(); })
        .catch(function (x) { out.value = x.message; });
    };
    root.appendChild(f); loadLic();
  }

  function form(a) {
    var old = document.getElementById("f"); if (old) old.remove();
    var f = el("form", "f"); f.id = "f";
    var F = [["id", "الـ applicationId", a.id, !!a.id], ["name", "الاسم", a.name], ["tagline", "السطر القصير", a.tagline], ["icon", "إيموجي", a.icon || "📱"],
      ["color", "اللون", a.color || "#1346a8"], ["version", "الإصدار", a.version], ["version_code", "versionCode", a.version_code || 0], ["size", "الحجم", a.size],
      ["updated", "آخر تحديث (2026-11-11)", a.updated], ["platform", "المنصة", a.platform || "Android"], ["sort", "الترتيب", a.sort || 0], ["apk", "رابط APK", a.apk, false, true]];
    var inp = {};
    F.forEach(function (x) {
      var l = el("label", x[4] ? "wide" : "", x[1]), i = el("input"); i.value = x[2] == null ? "" : x[2]; i.disabled = !!x[3];
      if (x[0] === "id" || x[0] === "name") i.required = true;
      inp[x[0]] = i; l.appendChild(i); f.appendChild(l);
    });
    var fl = el("label", "wide", "أو ارفع ملف APK مباشرة (حتى 50 م.ب)"), fi = el("input"), fm = el("p", "msg wide");
    fi.type = "file"; fi.accept = ".apk,application/vnd.android.package-archive"; fl.appendChild(fi); f.appendChild(fl); f.appendChild(fm);
    fi.onchange = function () {
      var file = fi.files[0]; if (!file) return;
      fm.style.color = "#c0392b";
      if (!inp.id.value.trim()) { fm.textContent = "اكتب الـ applicationId الأول."; fi.value = ""; return; }
      if (file.size > 50 * 1048576) { fm.textContent = "الملف أكبر من 50 م.ب."; fi.value = ""; return; }
      var name = inp.id.value.trim() + "-" + (inp.version_code.value || 0) + ".apk";
      fm.style.color = "inherit"; fm.textContent = "جاري الرفع...";
      fetch(C.url + "/storage/v1/object/apks/" + encodeURIComponent(name), { method: "POST", headers: { apikey: C.anonKey, Authorization: "Bearer " + (S && S.t), "x-upsert": "true", "Content-Type": "application/vnd.android.package-archive" }, body: file })
        .then(function (r) { if (!r.ok) return r.text().then(function (t) { throw new Error(t); }); })
        .then(function () {
          inp.apk.value = C.url + "/storage/v1/object/public/apks/" + encodeURIComponent(name);
          inp.size.value = (file.size / 1048576).toFixed(1) + " م.ب";
          if (!inp.updated.value) inp.updated.value = new Date().toISOString().slice(0, 10);
          fm.textContent = "تم الرفع ✓ اضغط حفظ عشان يظهر في الموقع.";
        })
        .catch(function (x) { fm.style.color = "#c0392b"; fm.textContent = "فشل الرفع: " + x.message + " (لو انتهت الجلسة سجّل دخول تاني)"; });
    };
    var il = el("label", "wide", "أيقونة التطبيق: رابط صورة (اختياري، بتظهر بدل الإيموجي)"), ii = el("input");
    ii.value = a.icon_image || ""; inp.icon_image = ii; il.appendChild(ii); f.appendChild(il);
    var ifl = el("label", "wide", "أو ارفع صورة الأيقونة مباشرة (PNG مربعة، حتى 2 م.ب)"), ifi = el("input"), im = el("p", "msg wide");
    ifi.type = "file"; ifi.accept = "image/png,image/jpeg,image/webp"; ifl.appendChild(ifi); f.appendChild(ifl); f.appendChild(im);
    ifi.onchange = function () {
      var file = ifi.files[0]; if (!file) return;
      im.style.color = "#c0392b";
      if (!inp.id.value.trim()) { im.textContent = "اكتب الـ applicationId الأول."; ifi.value = ""; return; }
      if (file.size > 2 * 1048576) { im.textContent = "الصورة أكبر من 2 م.ب."; ifi.value = ""; return; }
      var ext = file.type === "image/jpeg" ? "jpg" : file.type === "image/webp" ? "webp" : "png";
      var iname = inp.id.value.trim() + "-icon-" + Date.now() + "." + ext;
      im.style.color = "inherit"; im.textContent = "جاري رفع الأيقونة...";
      fetch(C.url + "/storage/v1/object/apks/" + encodeURIComponent(iname), { method: "POST", headers: { apikey: C.anonKey, Authorization: "Bearer " + (S && S.t), "x-upsert": "true", "Content-Type": file.type }, body: file })
        .then(function (r) { if (!r.ok) return r.text().then(function (t) { throw new Error(t); }); })
        .then(function () {
          ii.value = C.url + "/storage/v1/object/public/apks/" + encodeURIComponent(iname);
          im.textContent = "تم رفع الأيقونة ✓ اضغط حفظ عشان تظهر في الموقع.";
        })
        .catch(function (x) { im.style.color = "#c0392b"; im.textContent = "فشل رفع الأيقونة: " + x.message + " (ممكن تلصق رابط الصورة في الخانة اللي فوق بدل الرفع)"; });
    };
    function ta(k, label, v) { var l = el("label", "wide", label), t = el("textarea"); t.rows = 3; t.value = v; inp[k] = t; l.appendChild(t); f.appendChild(l); }
    ta("description", "الوصف", a.description || "");
    ta("notes", "وصف التحديث", a.notes || "");
    ta("screenshots", "لقطات الشاشة (رابط في كل سطر)", (a.screenshots || []).join("\n"));
    ta("links", "أزرار إضافية (الاسم|الرابط في كل سطر)", (a.links || []).map(function (l) { return l.label + "|" + l.url; }).join("\n"));
    var pl = el("label", "wide", "منشور على الصفحة "), pc = el("input"); pc.type = "checkbox"; pc.checked = a.published !== false; pl.appendChild(pc); f.appendChild(pl);
    var sv = el("button", "btn", "حفظ"); sv.type = "submit"; var m = el("p", "msg wide"); f.append(sv, m);
    f.onsubmit = function (e) {
      e.preventDefault();
      var row = { published: pc.checked };
      ["id", "name", "tagline", "icon", "color", "version", "size", "updated", "platform", "apk", "description", "notes"].forEach(function (k) { row[k] = inp[k].value.trim(); });
      row.icon_image = inp.icon_image.value.trim() || null;
      row.version_code = parseInt(inp.version_code.value, 10) || 0; row.sort = parseInt(inp.sort.value, 10) || 0;
      row.screenshots = inp.screenshots.value.split("\n").map(function (s) { return s.trim(); }).filter(Boolean);
      row.links = inp.links.value.split("\n").map(function (s) { var p = s.split("|"); return { label: (p[0] || "").trim(), url: (p.slice(1).join("|") || "").trim() }; }).filter(function (l) { return l.url; });
      api("apps?on_conflict=id", { method: "POST", headers: { Prefer: "resolution=merge-duplicates,return=minimal" }, body: JSON.stringify(row) })
        .then(load).catch(function (x) { m.textContent = x.message; });
    };
    root.appendChild(f); f.scrollIntoView({ behavior: "smooth" });
  }

  if (!C.url || !C.anonKey) root.appendChild(el("p", "msg", "اضبط url و anonKey في config.js أولًا."));
  else if (S && S.t) load(); else loginView();
})();
</script>
</body>
</html>
